<html>

<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mechanic_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>mechanic_mobile</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js')
        .then((registration) => {
          console.log('✅ Service Worker registrado:', registration);
        })
        .catch((error) => {
          console.log('❌ Error al registrar Service Worker:', error);
        });
    }
  </script>
  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";
    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-messaging.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

    // Your web app's Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyAiJtT0pDTgUmLa61eWyE-TCA4v9oHdN3s",
      authDomain: "mechanic-system-60380.firebaseapp.com",
      projectId: "mechanic-system-60380",
      storageBucket: "mechanic-system-60380.firebasestorage.app",
      messagingSenderId: "249326114363",
      appId: "1:249326114363:web:a949b8f9c786313831ae1e",
      measurementId: "G-707G8X95T4"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const messaging = getMessaging(app);

    // ✅ Solicitar token FCM
    getToken(messaging, { vapidKey: 'BNKs9MawNjRfsrgM8vj4xYnPVWMOCYlsJZVnM4-7R7yK9xChXQR0WaYJiJsdo4_sfOshIxGnx78zQCK2DPepPLs' })
      .then((currentToken) => {
        if (currentToken) {
          console.log('✅ FCM Token web:', currentToken);
          // Enviar token al backend
          window.parent.postMessage({
            type: 'fcmToken',
            token: currentToken
          }, '*');
        } else {
          console.log('⚠️ No se pudo obtener token FCM');
        }
      })
      .catch((err) => {
        console.log('❌ Error obteniendo token FCM:', err);
      });

    // ✅ Escuchar mensajes en primer plano
    onMessage(messaging, (payload) => {
      console.log('🔔 Notificación en primer plano:', payload);
      // Mostrar notificación con JavaScript
      if (window.showNotification) {
        window.showNotification(
          payload.notification.title,
          payload.notification.body,
          payload.data?.actionUrl
        );
      }
    });
  </script>
</body>

</html>
